name: Python regression tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      real_kernel:
        description: Run the isolated openEuler kernel verification on a configured runner
        type: boolean
        default: false

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q
      - run: python -m compileall -q schedx scripts

  kernel-validation:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.real_kernel }}
    runs-on: [self-hosted, linux, sched-ext]
    steps:
      - uses: actions/checkout@v4
      - name: Build against the runner's isolated kernel toolchain
        env:
          SCHEDX_KERNEL_SCX_DIR: ${{ vars.SCHEDX_KERNEL_SCX_DIR }}
        run: |
          test -n "$SCHEDX_KERNEL_SCX_DIR"
          make -C scx KERNEL_SCX_DIR="$SCHEDX_KERNEL_SCX_DIR"
          make -C ebpf
      - name: Verify real kernel behavior
        run: sudo env "PATH=$PWD/scx/output:$PATH" python3 scripts/verify_optimization.py --duration 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-verification
          path: results/optimization-validation
