[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schedx-agent"
version = "0.4.0"
description = "Adaptive Linux resource-control Agent with cgroup v2 and sched_ext."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SchedX Lab" }]
dependencies = []

[project.scripts]
schedx = "schedx.main:main"

[tool.setuptools.packages.find]
include = ["schedx*"]
