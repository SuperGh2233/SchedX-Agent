[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schedx-agent"
version = "0.1.0"
description = "SchedX-Agent MVP for adaptive Linux workload resource control."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SchedX Lab" }]
dependencies = []

[project.scripts]
schedx = "schedx.main:main"

[tool.setuptools.packages.find]
include = ["schedx*"]
